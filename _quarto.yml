project:
  type: book
  output-dir: docs
  
book:
  title: "Data and Digital Asset Governance"
  subtitle: "Forecasting and Warning"
  author: "Jonathan Payne"
  date: "March 2026"
  version: "1.4"
  search: true
  reader-mode: true
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Projects"
        menu:
         - text: "flode"
           href: https://github.com/JonPayneEA/flode
         - text: "reach.io"
           href: https://github.com/JonPayneEA/reach.io
         - text: "reach.hydro"
           href: https://github.com/JonPayneEA/reach.hydro
    right:
      - icon: github
        href: https://github.com
  page-footer:
    left: |
      The Forecastin & Warning Data and Digital Asset Governance was written by 
      Jonathan Payne.
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
  cover-image: figures/logo.svg
  favicon: figures/logo.svg
  site-url: https://jonpayneea.github.io/Governance/
  repo-url: https://github.com/JonPayneEA/Governance
  repo-branch: main
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - 01-governance-framework.qmd
    - part: Code Companions
      chapters:
        - 03-r-code-governance.qmd
        - 04-python-code-governance.qmd
    - part: Data Companions
      chapters:
        - 05-hydrometric-data.qmd
    - part: Model Companions
      chapters:
        - 06-flood-model-governance.qmd
    - part: Training and Implementation
      chapters:
        - 07-training-framework.qmd
        - 08-implementation.qmd
  appendices:
    - a-glossary.qmd
    - b-document-hierarchy.qmd
    - c-alignment-register.qmd
    - d-upcoming-changes.qmd
    - e-file-format-reference.qmd
    - f-mcp-server-spec.qmd

format:
  html:
    theme: 
      light: [cosmo, water-theme.scss]
      dark: [darkly]
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    number-sections: true
    css: styles.css
