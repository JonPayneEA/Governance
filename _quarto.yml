project:
  type: book
  output-dir: docs
  
book:
  title: "Data and Digital Asset Governance"
  subtitle: "National Forecasting and Warning Service"
  author: "Jonathan Payne"
  date: "2026"
  version: "3.0"
  search: true
  reader-mode: true
  navbar:
    logo: figures/logo.svg
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Useful datasets"
        menu:
          - text: "flode"
            href: https://github.com/JonPayneEA/flode
          - text: "reach.io"
            href: https://github.com/JonPayneEA/reach.io
          - text: "reach.hydro"
            href: https://github.com/JonPayneEA/reach.hydro
      - text: "Tools"
        menu:
          - text: "flode"
            href: https://github.com/JonPayneEA/flode
          - text: "reach.io"
            href: https://github.com/JonPayneEA/reach.io
          - text: "reach.hydro"
            href: https://github.com/JonPayneEA/reach.hydro
    right:
      - icon: github
        href: https://github.com
  page-footer:
    left: |
      The NFWS Data and Digital Asset Governance was written by Jonathan Payne.
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
  cover-image: figures/logo.svg
  favicon: figures/logo.svg
  site-url: https://jonpayneea.github.io/Governance/
  repo-url: https://github.com/JonPayneEA/Governance
  repo-branch: main
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - 01-governance-framework.qmd
    - 02-central-data-team.qmd
    - 03-shared-datasets.qmd
    - 04-future-directions.qmd
    - part: "Code companions"
      chapters:
        - companions/r-governance.qmd
        - companions/python-governance.qmd
    - part: "Data companions"
      chapters:
        - companions/hydrometric-data.qmd
    - part: "Model companions"
      chapters:
        - companions/flood-models.qmd
    - part: "Warning and procedure companions"
      chapters:
        - companions/flood-warnings.qmd
        - companions/procedure-tools.qmd
    - part: "Training and implementation"
      chapters:
        - companions/training-framework.qmd
        - 08-implementation.qmd
  appendices:
    - a-glossary.qmd
    - b-document-hierarchy.qmd
    - c-alignment-register.qmd
    - d-upcoming-changes.qmd
    - e-file-format-reference.qmd
    - f-mcp-server-spec.qmd

format:
  html:
    theme: 
      light: [cosmo, water-theme.scss]
      dark: [darkly, water-theme-dark.scss]
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    number-sections: true
    css: styles.css
