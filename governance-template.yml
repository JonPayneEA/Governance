# governance.yml
#
# Place this file in the root of every tool repository.
# It supplies the governance fields that cannot be inferred from GitHub metadata.
# The build_tool_register.R script merges this file with the GitHub API response
# to produce the central tool_register.csv in the governance repository.
#
# GitHub topics supply tier and status if not set here (see conventions below),
# but values in this file take precedence.
#
# Topic conventions for this repository:
#   Tier:   tier-1 | tier-2 | tier-3
#   Status: active | under-development | deprecated

# Operational tier. One of: 1, 2, 3
tier: ~

# Primary language(s). One of: R | Python | R and Python
# Leave blank to use GitHub's detected primary language.
language: ~

# Lifecycle status. One of: Active | Under Development | Deprecated
# Leave blank to derive from GitHub topics.
status: ~

owner:
  name: ~          # Full name
  grade: ~         # e.g. G6, G7, SEO

steward:
  name: ~          # Full name, or leave blank if delegated
  grade: ~         # Must be G7 for Tier 1 tools
  delegated_to: ~  # Name of Delegated Steward, if applicable

# List one entry per custodian.
custodians:
  - name: ~
    grade: ~

# Information Asset Owner. Name, or "Owner fulfils this function".
iao: ~

# Date of last formal governance review (YYYY-MM-DD).
last_reviewed: ~

# Known issues, planned changes, or active exceptions.
# Leave blank to use the GitHub repository description.
notes: ~
